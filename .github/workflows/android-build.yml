name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up JDK 17
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Release-tool tests
      run: python3 -m unittest discover -s tools/release -p 'test_*.py' -v

    - name: Build, unit tests and lint (both flavors)
      run: ./gradlew :app:assembleDebug :app:testStandardDebugUnitTest :app:testDemoDebugUnitTest :app:lintStandardDebug :app:lintDemoDebug

    # The release variants are shrunk by R8, so build them on every change, not only when releasing.
    # They stay unsigned; tools/release checks identity, flags and alignment but nothing is published here.
    - name: Build and verify unsigned release APKs
      run: |
        ./gradlew :app:assembleStandardRelease :app:assembleDemoRelease
        python3 tools/release/kismet_release.py stage --out "$RUNNER_TEMP/unsigned"
        python3 -m unittest discover -s tools/release -p 'test_*.py'

    # Debug APKs are signed with a throwaway key that GitHub's runner generates for each run: they can be
    # installed for a quick look but can never be updated by a later build.  Releases are the install path.
    - name: Upload debug APKs (throwaway signing key, not for distribution)
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ci-debug-apks-throwaway-key
        path: app/build/outputs/apk/*/debug/*.apk
        if-no-files-found: error
        retention-days: 14
