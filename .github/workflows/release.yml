# Builds the *unsigned* release APKs (standard + demo) on GitHub's runners and attests their provenance.
#
# This workflow never signs and never publishes: it holds no secrets and no job has write access to the
# repository or to releases.  The maintainer downloads the artifact, verifies the attestation, signs with the
# persistent release key on their own computer (tools/release/kismet_release.py sign) and creates the GitHub
# Release by hand.  See RELEASING.md.
name: Release build (unsigned)

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag these APKs are for, e.g. v1.4.0-rc1 (must equal "v" + versionName)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify unsigned APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sums-sha256: ${{ steps.stage.outputs.sums-sha256 }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # No dependency cache: a release build must not restore data written by other workflow runs.
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve the release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::'$tag' is not a release tag of the form vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Release-tool unit tests, app unit tests and lint (both flavors)
        run: |
          python3 -m unittest discover -s tools/release -p 'test_*.py' -v
          chmod +x gradlew
          ./gradlew --no-daemon :app:testStandardDebugUnitTest :app:testDemoDebugUnitTest \
            :app:lintStandardDebug :app:lintDemoDebug :app:lintStandardRelease :app:lintDemoRelease

      - name: Build unsigned release APKs
        run: ./gradlew --no-daemon :app:assembleStandardRelease :app:assembleDemoRelease

      - name: Release-tool integration tests against the real APKs
        run: python3 -m unittest discover -s tools/release -p 'test_*.py' -v

      - name: Verify and stage the APKs
        id: stage
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 tools/release/kismet_release.py stage \
            --tag "$RELEASE_TAG" --source-sha "$GITHUB_SHA" --out dist/unsigned
          sums_sha256="$(sha256sum dist/unsigned/SHA256SUMS.unsigned | cut -d' ' -f1)"
          printf 'sums-sha256=%s\n' "$sums_sha256" >> "$GITHUB_OUTPUT"
          {
            echo "### Unsigned release APKs for \`$RELEASE_TAG\`"
            echo
            echo 'These files are **not installable** until the maintainer signs them. See RELEASING.md.'
            echo
            echo '```'
            cat dist/unsigned/SHA256SUMS.unsigned
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the unsigned APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apks-${{ steps.tag.outputs.tag }}
          path: dist/unsigned/*
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only this job can mint an attestation, and it runs no project code.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the unsigned APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-apks-${{ needs.build.outputs.tag }}
          path: dist/unsigned

      - name: Check the files are the ones the build job produced
        env:
          EXPECTED_SUMS_SHA256: ${{ needs.build.outputs.sums-sha256 }}
        run: |
          cd dist/unsigned
          test "$(sha256sum SHA256SUMS.unsigned | cut -d' ' -f1)" = "$EXPECTED_SUMS_SHA256"
          sha256sum --check SHA256SUMS.unsigned
          test "$(ls -1 *.apk | wc -l)" = "2"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/unsigned/*.apk
